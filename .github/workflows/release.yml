name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    name: publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - run: pnpm run lint

      - run: pnpm run build

      - run: pnpm test

      - name: Verify tag matches package.json version
        run: |
          TAG="${{ github.ref }}"
          TAG="${TAG#refs/tags/}"
          VERSION=$(node -e "console.log(require('./package.json').version)")
          if [ "$TAG" != "v$VERSION" ]; then
            echo "Error: tag '$TAG' does not match package.json version 'v$VERSION'"
            exit 1
          fi
          echo "✓ Tag version matches package.json"

      - name: Verify package contents
        run: |
          npm pack --dry-run --json > pack.json
          node -e "
            const p = JSON.parse(require('fs').readFileSync('pack.json'));
            const files = p[0].files.map(f => f.path).sort();
            const required = ['dist/index.cjs', 'dist/index.mjs', 'dist/index.d.ts', 'README.md', 'CHANGELOG.md', 'LICENSE', 'package.json'];
            const missing = required.filter(r => !files.includes(r));
            if (missing.length) {
              console.error('Missing required files in tarball:', missing);
              console.error('Got:', files);
              process.exit(1);
            }
            const forbidden = files.filter(f => f.startsWith('test/') || f.startsWith('src/') || f === 'tsconfig.json' || f === 'tsup.config.ts' || f === 'vitest.config.ts' || f.startsWith('vitest.integration') || f === '.github');
            if (forbidden.length) {
              console.error('Tarball contains files that should not be published:', forbidden);
              process.exit(1);
            }
            console.log('Tarball OK. Files:', files);
          "

      - name: Publish to npm
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        run: gh release create "${{ github.ref }}" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
